name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (only if the zip was uploaded)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o -q *.zip -d project
          fi
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrendyZone-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
